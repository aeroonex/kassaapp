# Nusxa oling: secret.yaml deb saqlang, qiymatlarni almashtiring, keyin:
#   kubectl apply -f secret.yaml
# secret.yaml ni git'ga HECH QACHON commit qilmang (.gitignore'da bor).
apiVersion: v1
kind: Secret
metadata:
  name: kassaapp-server-env
  namespace: kassaapp
type: Opaque
stringData:
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "CHANGE-ME"
  SESSION_SECRET: "CHANGE-ME-long-random-string"
  UPLOAD_TOKEN: "CHANGE-ME-device-token"
  RETENTION_DAYS: "30"
